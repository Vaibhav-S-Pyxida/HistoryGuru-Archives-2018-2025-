            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1),

        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(120, 120, 130, 0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(120, 120, 130, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        
        .line-clamp-2 { 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }

        .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-zoom-in { animation: zoomIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>

        // Extended multi-year complete archive (2017 to 2026)
        const DEFAULT_CHATLOG = `28/06/2017, 21:12 - +91 89597 02290 created group "Economic HistoryGuru"

        const COLORS = [
          'text-[#3498db]', 'text-[#2ecc71]', 'text-[#e74c3c]', 
          'text-[#f1c40f]', 'text-[#9b59b6]', 'text-[#e91e63]', 
          'text-[#1abc9c]', 'text-[#e67e22]'
        ];

        const LIGHT_COLORS = [
          'text-[#2980b9]', 'text-[#27ae60]', 'text-[#c0392b]',
          'text-[#f39c12]', 'text-[#8e44ad]', 'text-[#d81b60]',
          'text-[#16a085]', 'text-[#d35400]'
        ];

        // System Configuration
        const apiKey = ""; 

        const callAIProcessor = async (prompt, systemInstruction = "") => {
          let retries = 0;
          const maxRetries = 3;

          while (retries < maxRetries) {
            try {
              if (!apiKey) {
                return "API key not configured for standard queries.";
              }
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  systemInstruction: { parts: [{ text: systemInstruction }] }
                })
              });
              const data = await response.json();
              if (data.error) throw new Error(data.error.message);
              return data.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (e) {
              retries++;
              if (retries === maxRetries) return "Unable to complete request at this time.";
              await new Promise(res => setTimeout(res, 1000 * retries));
            }
          }
        };

        const MessageItem = memo(({ msg, isFirstInGroup, onExplain, explanation, messageRef, isDarkMode }) => {
          const authorColor = isDarkMode ? msg.color : msg.lightColor;

          return (
            <div 
              ref={messageRef}
              className={`group flex items-start gap-4 py-1 -mx-4 px-4 transition-colors duration-200 ${isDarkMode ? 'hover:bg-[#2e3035]' : 'hover:bg-gray-100'} ${isFirstInGroup ? 'mt-4' : ''}`}
            >
              {isFirstInGroup ? (
                <>
                  <img src={msg.avatar} className={`w-10 h-10 rounded-full shrink-0 ${isDarkMode ? 'bg-[#4e5058]' : 'bg-gray-300'}`} alt="" />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-baseline gap-2">
                      <span className={`font-bold hover:underline cursor-pointer truncate ${authorColor}`}>{msg.author}</span>
                      <span className={`text-[11px] font-medium ${isDarkMode ? 'text-[#949ba4]' : 'text-gray-500'}`}>{msg.timestamp}</span>
                    </div>
                    <div className={`whitespace-pre-wrap leading-[1.375rem] text-[15px] font-sans relative ${isDarkMode ? 'text-[#dbdee1]' : 'text-gray-800'}`}>
                      {msg.content}
                      <button 
                        onClick={() => onExplain(msg)}
                        className={`absolute -right-2 top-0 opacity-0 group-hover:opacity-100 p-1 rounded transition-all shadow-sm ${isDarkMode ? 'bg-[#1e1f22] text-[#b5bac1] hover:text-[#f1c40f]' : 'bg-white text-gray-400 hover:text-yellow-600 border border-gray-200'}`}
                      >
                        <SparklesIcon size={14} />
                      </button>
                    </div>
                    {explanation && (
                      <div className={`mt-2 p-3 rounded-md border-l-2 text-xs animate-fade-in ${isDarkMode ? 'bg-[#1e1f22] border-[#f1c40f] text-[#dbdee1]' : 'bg-yellow-50 border-yellow-500 text-yellow-900'}`}>
                        <div className={`font-bold mb-1 flex items-center gap-1 uppercase tracking-wider text-[9px] ${isDarkMode ? 'text-[#f1c40f]' : 'text-yellow-700'}`}>
                          <BrainIcon size={10} /> Contextual Analysis
                        </div>
                        {explanation}
                      </div>
                    )}
                  </div>
                </>
              ) : (
                <div className="flex w-full pl-[56px] relative">
                  <div className={`whitespace-pre-wrap leading-[1.375rem] text-[15px] flex-1 font-sans relative group/inner ${isDarkMode ? 'text-[#dbdee1]' : 'text-gray-800'}`}>
                    {msg.content}
                    <button 
                      onClick={() => onExplain(msg)}
                      className={`absolute -right-2 top-0 opacity-0 group-hover/inner:opacity-100 p-1 rounded transition-all ${isDarkMode ? 'bg-[#1e1f22] text-[#b5bac1] hover:text-[#f1c40f]' : 'bg-white text-gray-400 hover:text-yellow-600 border border-gray-200'}`}
                    >
                      <SparklesIcon size={14} />
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        });

        function App() {
          const [chatData, setChatData] = useState(null);
          const [activeYear, setActiveYear] = useState(null);
          const [isLoading, setIsLoading] = useState(false);
          const [explanation, setExplanation] = useState({ id: null, text: null });
          const [searchQuery, setSearchQuery] = useState("");
          const [isSearching, setIsSearching] = useState(false);
          const [globalMessages, setGlobalMessages] = useState([]);
          const [isDarkMode, setIsDarkMode] = useState(true);

          const [isBotOpen, setIsBotOpen] = useState(false);
          const [botMessages, setBotMessages] = useState([{ role: 'model', content: "Hello! I'm your AI History Assistant. Ask me anything about the discussions!" }]);
          const [userBotInput, setUserBotInput] = useState("");
          const [isBotLoading, setIsBotLoading] = useState(false);
          const [yearlySummary, setYearlySummary] = useState({});
          const [isSummarizing, setIsSummarizing] = useState(false);
          
          const fileInputRef = useRef(null);
          const messageRefs = useRef({});

          const parseWhatsAppLog = (text) => {
            const lines = text.split('\n');
            const parsedData = {};
            const allMsgsList = [];
            const participantMap = {};
            let colorIndex = 0;

            const msgRegex = /^(\d{1,2}\/\d{1,2}\/(\d{2,4})),\s+(\d{1,2}:\d{2})\s-\s([^:]+):\s(.*)$/;
            const sysRegex = /^(\d{1,2}\/\d{1,2}\/(\d{2,4})),\s+(\d{1,2}:\d{2})\s-\s(.*)$/;

            let currentMsg = null;

            lines.forEach((line) => {
              const msgMatch = line.match(msgRegex);
              if (msgMatch) {
                const [_, dateStr, yearPart, timeStr, author, content] = msgMatch;
                const fullYear = yearPart.length === 2 ? '20' + yearPart : yearPart;
                if (!parsedData[fullYear]) parsedData[fullYear] = [];
                if (!participantMap[author]) {
                  participantMap[author] = {
                    color: COLORS[colorIndex % COLORS.length],
                    lightColor: LIGHT_COLORS[colorIndex % LIGHT_COLORS.length],
                    avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(author)}`
                  };
                  colorIndex++;
                }
                const isFirstInGroup = parsedData[fullYear].length === 0 || 
                                     parsedData[fullYear][parsedData[fullYear].length - 1].author !== author;
                currentMsg = {
                  id: Math.random().toString(36).substr(2, 9),
                  author, avatar: participantMap[author].avatar,
                  color: participantMap[author].color, 
                  lightColor: participantMap[author].lightColor,
                  content: content.trim(),
                  timestamp: `${dateStr} ${timeStr}`, fullYear, isFirstInGroup, isSystem: false
                };
                parsedData[fullYear].push(currentMsg);
                allMsgsList.push(currentMsg);
              } else {
                const sysMatch = line.match(sysRegex);
                if (sysMatch) {
                  const [_, dateStr, yearPart, timeStr, content] = sysMatch;
                  const fullYear = yearPart.length === 2 ? '20' + yearPart : yearPart;
                  if (!parsedData[fullYear]) parsedData[fullYear] = [];
                  currentMsg = { id: Math.random().toString(36).substr(2, 9), author: "System", content: content.trim(), timestamp: `${dateStr} ${timeStr}`, fullYear, isSystem: true };
                  parsedData[fullYear].push(currentMsg);
                } else if (currentMsg && line.trim() !== '' && !currentMsg.isSystem) {
                  currentMsg.content += '\n' + line.trim();
                }
              }
            });

            setChatData(parsedData);
            setGlobalMessages(allMsgsList);
            setActiveYear(Object.keys(parsedData).sort((a, b) => b - a)[0]);
            setIsLoading(false);
          };

          const years = useMemo(() => chatData ? Object.keys(chatData).sort((a, b) => b - a) : [], [chatData]);
          const currentMessages = useMemo(() => chatData && activeYear ? chatData[activeYear] : [], [chatData, activeYear]);

          const searchResults = useMemo(() => {
            if (!searchQuery || searchQuery.length < 2) return [];
            const query = searchQuery.toLowerCase();
            return globalMessages.filter(m => 
              m.content.toLowerCase().includes(query) || 
              m.author.toLowerCase().includes(query)
            ).slice(0, 50);
          }, [searchQuery, globalMessages]);

          const handleExplain = async (msg) => {
            if (explanation.id === msg.id && explanation.text) {
              setExplanation({ id: null, text: null });
              return;
            }
            setExplanation({ id: msg.id, text: "Consulting historical archives..." });
            const res = await callAIProcessor(`Context for: "${msg.content}". 2 sentences max.`, "You are a history expert.");
            setExplanation({ id: msg.id, text: res });
          };

          const generateYearlySummary = async () => {
            if (yearlySummary[activeYear]) return;
            setIsSummarizing(true);
            const sample = currentMessages.filter(m => !m.isSystem).slice(0, 30).map(m => `${m.author}: ${m.content}`).join('\n');
            const res = await callAIProcessor(`Summarize main discussions for ${activeYear}: ${sample}`, "Archivist assistant.");
            setYearlySummary(prev => ({ ...prev, [activeYear]: res }));
            setIsSummarizing(false);
          };

          const askBot = async (e) => {
            e.preventDefault();
            if (!userBotInput.trim() || isBotLoading) return;
            const input = userBotInput;
            setBotMessages(prev => [...prev, { role: 'user', content: input }]);
            setUserBotInput("");
            setIsBotLoading(true);
            const context = currentMessages.slice(-20).map(m => `${m.author}: ${m.content}`).join('\n');
            const res = await callAIProcessor(`Context:\n${context}\n\nQ: ${input}`, "HistoryGuru AI.");
            setBotMessages(prev => [...prev, { role: 'model', content: res }]);
            setIsBotLoading(false);
          };

          if (!chatData) {
            return (
              <div className={`flex flex-col h-screen items-center justify-center p-6 text-center transition-colors duration-300 ${isDarkMode ? 'bg-[#313338] text-white' : 'bg-gray-100 text-gray-900'}`}>
                <div className={`max-w-xl w-full p-10 rounded-2xl shadow-2xl border transition-colors ${isDarkMode ? 'bg-[#2b2d31] border-[#1e1f22]' : 'bg-white border-gray-200'}`}>
                  {isLoading ? <LoaderIcon size={48} className="animate-spin text-[#5865f2] mx-auto mb-6" /> : <UploadIcon size={48} className="text-[#5865f2] mx-auto mb-6" />}
                  <h1 className="text-3xl mb-1 font-bold">HistoryGuru Archives</h1>
                  <p className={`mb-8 text-sm tracking-wide ${isDarkMode ? 'text-[#b5bac1]' : 'text-gray-500'}`}>Upload your WhatsApp chat export file or load the built-in archive</p>
                  
                  <input type="file" ref={fileInputRef} onChange={(e) => { 
                    if (e.target.files[0]) {
                      setIsLoading(true);
                      const reader = new FileReader();
                      reader.onload = (ev) => parseWhatsAppLog(ev.target.result);
                      reader.readAsText(e.target.files[0]);
                    }
                  }} className="hidden" accept=".txt" />

                  <div className="flex flex-col gap-3">
                    <button onClick={() => fileInputRef.current.click()} className="w-full py-3.5 bg-[#5865f2] hover:bg-[#4752c4] rounded-lg font-bold transition-all flex items-center justify-center gap-2 text-white shadow-md">
                      <PlusIcon size={20} /> Select Custom Log File (.txt)
                    </button>
                    <button onClick={() => parseWhatsAppLog(DEFAULT_CHATLOG)} className={`w-full py-3.5 rounded-lg font-bold transition-all flex items-center justify-center gap-2 border ${isDarkMode ? 'bg-[#35373c] hover:bg-[#3f4147] border-[#4e5058] text-white' : 'bg-gray-200 hover:bg-gray-300 border-gray-300 text-gray-800'}`}>
                      Load Full 10-Year Archive (2017–2026)
                    </button>
                  </div>
                  
                  <div className="mt-8 flex flex-col gap-3 items-center">
                     <button 
                        onClick={() => setIsDarkMode(!isDarkMode)}
                        className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold transition-all ${isDarkMode ? 'bg-[#3f4147] text-white hover:bg-[#4e5058]' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                     >
                        {isDarkMode ? <><SunIcon size={14} /> Light Mode</> : <><MoonIcon size={14} /> Dark Mode</>}
                     </button>
                     <div className="text-[10px] uppercase tracking-widest font-bold opacity-60">© HMS || ANTHERRDAM | VAIBHAV S.</div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className={`flex h-screen overflow-hidden transition-colors duration-300 ${isDarkMode ? 'bg-[#313338] text-[#dbdee1]' : 'bg-white text-gray-800'}`}>
              <nav className={`w-[72px] flex flex-col items-center py-3 gap-4 shrink-0 transition-colors ${isDarkMode ? 'bg-[#1e1f22]' : 'bg-gray-200'}`}>
                <div className="w-12 h-12 bg-[#5865f2] rounded-[16px] flex items-center justify-center text-white font-bold shadow-lg">HG</div>
                <button onClick={() => setIsSearching(true)} title="Search Chronology" className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${isDarkMode ? 'bg-[#313338] text-[#949ba4] hover:bg-[#23a559] hover:text-white' : 'bg-white text-gray-500 hover:bg-green-500 hover:text-white shadow-sm border border-gray-300'}`}><SearchIcon size={22} /></button>
                <button onClick={() => setIsBotOpen(!isBotOpen)} title="AI Assistant" className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${isBotOpen ? 'bg-[#5865f2] text-white' : (isDarkMode ? 'bg-[#313338] text-[#949ba4] hover:bg-[#5865f2] hover:text-white' : 'bg-white text-gray-500 hover:bg-[#5865f2] hover:text-white shadow-sm border border-gray-300')}`}><BotIcon size={24} /></button>
                
                <div className="mt-auto flex flex-col gap-4">
                    <button onClick={() => setIsDarkMode(!isDarkMode)} className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${isDarkMode ? 'bg-[#313338] text-[#f1c40f] hover:bg-yellow-500 hover:text-white' : 'bg-white text-gray-500 hover:bg-indigo-600 hover:text-white shadow-sm border border-gray-300'}`}>
                        {isDarkMode ? <SunIcon size={22} /> : <MoonIcon size={22} />}
                    </button>
                    <button onClick={() => setChatData(null)} title="Close File" className={`w-12 h-12 rounded-full flex items-center justify-center transition-all mb-2 ${isDarkMode ? 'bg-[#313338] text-[#949ba4] hover:bg-[#da373c] hover:text-white' : 'bg-white text-gray-500 hover:bg-red-500 hover:text-white shadow-sm border border-gray-300'}`}><LogOutIcon size={22} /></button>
                </div>
              </nav>

              <aside className={`w-64 flex flex-col border-r transition-colors ${isDarkMode ? 'bg-[#2b2d31] border-[#1e1f22]' : 'bg-gray-50 border-gray-200'}`}>
                <div className={`h-12 px-4 flex items-center border-b font-bold transition-colors ${isDarkMode ? 'text-white border-[#1f2023]' : 'text-gray-900 border-gray-200'}`}>Archives Timeline</div>
                <div className="p-4 overflow-y-auto flex-1 custom-scrollbar">
                  <div className={`uppercase text-[11px] font-bold mb-2 tracking-widest ${isDarkMode ? 'text-[#949ba4]' : 'text-gray-400'}`}>Years</div>
                  {years.map(y => (
                    <button key={y} onClick={() => setActiveYear(y)} className={`w-full flex items-center gap-2 px-2 py-1.5 rounded mb-[2px] transition-colors ${activeYear === y ? (isDarkMode ? 'bg-[#3f4147] text-white' : 'bg-white shadow-sm text-indigo-600 ring-1 ring-gray-200') : (isDarkMode ? 'text-[#949ba4] hover:bg-[#35373c]' : 'text-gray-500 hover:bg-gray-200')}`}>
                      <HashIcon size={16} /> | {y}
                    </button>
                  ))}
                </div>
              </aside>

              <main className="flex-1 flex flex-col min-w-0">
                <header className={`h-12 px-4 flex items-center border-b justify-between shadow-sm transition-colors ${isDarkMode ? 'bg-[#313338] border-[#1f2023]' : 'bg-white border-gray-200'}`}>
                  <div className={`flex items-center gap-2 font-bold transition-colors ${isDarkMode ? 'text-white' : 'text-gray-900'}`}><HashIcon size={20} className="text-[#80848e]" /> {activeYear}_logs</div>
                  <div className="flex items-center gap-2">
                    <button onClick={generateYearlySummary} disabled={isSummarizing} className={`text-xs flex items-center gap-2 px-3 py-1.5 rounded transition-colors font-medium ${isDarkMode ? 'bg-[#4e5058] hover:bg-[#6d6f78] text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300'}`}>
                      {isSummarizing ? <LoaderIcon size={12} className="animate-spin" /> : <SparklesIcon size={12} />} Digest
                    </button>
                    <button onClick={() => setChatData(null)} className="text-xs bg-[#da373c]/10 hover:bg-[#da373c]/20 text-[#da373c] px-3 py-1.5 rounded transition-colors font-bold border border-[#da373c]/20">
                      Close Archive
                    </button>
                  </div>
                </header>

                <div className="flex-1 overflow-y-auto px-4 custom-scrollbar">
                  <div className="py-8">
                    <h1 className={`text-3xl font-bold ${isDarkMode ? 'text-white' : 'text-gray-900'}`}>{activeYear} Archive</h1>
                    {yearlySummary[activeYear] && (
                      <div className={`mt-4 p-4 border rounded-lg text-sm animate-zoom-in ${isDarkMode ? 'bg-[#23a559]/10 border-[#23a559]/30 text-[#dbdee1]' : 'bg-green-50 border-green-200 text-green-900'}`}>
                        <div className={`font-bold mb-2 uppercase tracking-tighter text-xs ${isDarkMode ? 'text-[#23a559]' : 'text-green-700'}`}>✨ AI Archive Summary</div>
                        <div className="whitespace-pre-wrap">{yearlySummary[activeYear]}</div>
                      </div>
                    )}
                  </div>
                  {currentMessages.map(msg => (
                    msg.isSystem ? (
                        <div key={msg.id} className={`py-2 text-center text-[11px] italic ${isDarkMode ? 'text-[#949ba4]' : 'text-gray-400'}`}>{msg.content}</div>
                    ) : (
                        <MessageItem 
                            key={msg.id} 
                            msg={msg} 
                            isFirstInGroup={msg.isFirstInGroup} 
                            onExplain={handleExplain} 
                            explanation={explanation.id === msg.id ? explanation.text : null} 
                            messageRef={el => messageRefs.current[msg.id] = el} 
                            isDarkMode={isDarkMode}
                        />
                    )
                  ))}
                  <div className="h-10"></div>
                </div>
              </main>

              {isBotOpen && (
                <aside className={`w-80 flex flex-col border-l transition-colors animate-slide-right duration-300 ${isDarkMode ? 'bg-[#2b2d31] border-[#1e1f22]' : 'bg-gray-50 border-gray-200'}`}>
                  <div className={`h-12 px-4 flex items-center border-b justify-between font-bold transition-colors ${isDarkMode ? 'text-white border-[#1f2023]' : 'text-gray-900 border-gray-200'}`}>
                    <div className="flex items-center gap-2"><BotIcon size={18} className="text-[#5865f2]" /> History AI</div>
                    <button onClick={() => setIsBotOpen(false)} className={`${isDarkMode ? 'text-[#949ba4] hover:text-white' : 'text-gray-400 hover:text-gray-700'}`}><XIcon size={18} /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-4 custom-scrollbar">
                    {botMessages.map((m, i) => (
                        <div key={i} className={`p-3 rounded-lg text-sm shadow-sm ${m.role === 'user' ? 'bg-[#5865f2] text-white self-end ml-4' : (isDarkMode ? 'bg-[#313338] text-[#dbdee1] self-start mr-4' : 'bg-white border border-gray-200 text-gray-800 self-start mr-4')}`}>
                            {m.content}
                        </div>
                    ))}
                  </div>
                  <form onSubmit={askBot} className={`p-4 border-t transition-colors ${isDarkMode ? 'border-[#1f2023]' : 'border-gray-200'}`}>
                    <input type="text" value={userBotInput} onChange={e => setUserBotInput(e.target.value)} placeholder="Ask Guru..." className={`w-full rounded px-3 py-2 text-sm outline-none transition-colors ${isDarkMode ? 'bg-[#383a40] text-white placeholder-[#949ba4]' : 'bg-white border border-gray-300 text-gray-900 placeholder-gray-400 focus:border-[#5865f2]'}`} />
                  </form>
                </aside>
              )}

              {isSearching && (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 backdrop-blur-sm animate-fade-in">
                  <div className={`w-full max-w-xl rounded-xl shadow-2xl flex flex-col max-h-[80vh] border transition-colors ${isDarkMode ? 'bg-[#2b2d31] border-[#1e1f22]' : 'bg-white border-gray-200'}`}>
                    <div className={`p-4 border-b flex items-center gap-3 transition-colors ${isDarkMode ? 'border-[#1f2023]' : 'border-gray-200'}`}>
                      <SearchIcon className="text-[#5865f2]" size={24} />
                      <input autoFocus value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search messages or authors..." className={`bg-transparent flex-1 outline-none text-lg ${isDarkMode ? 'text-white' : 'text-gray-900'}`} />
                      <button onClick={() => setIsSearching(false)} className={`${isDarkMode ? 'text-white' : 'text-gray-400'}`}><XIcon size={20} /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-2">
                      {searchResults.map(r => (
                        <div key={r.id} onClick={() => { setActiveYear(r.fullYear); setIsSearching(false); setTimeout(() => messageRefs.current[r.id]?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200); }} className={`p-3 rounded cursor-pointer transition-colors border-b last:border-0 ${isDarkMode ? 'hover:bg-[#3f4147] border-[#1f2023]' : 'hover:bg-gray-100 border-gray-100'}`}>
                          <div className="flex justify-between text-[10px] mb-1 font-bold">
                            <span className={isDarkMode ? r.color : r.lightColor}>{r.author} ({r.fullYear})</span>
                            <span className={isDarkMode ? 'text-[#949ba4]' : 'text-gray-400'}>{r.timestamp}</span>
                          </div>
                          <div className={`text-sm line-clamp-2 ${isDarkMode ? 'text-[#dbdee1]' : 'text-gray-600'}`}>{r.content}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
